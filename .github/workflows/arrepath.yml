name: ArrePath MMP regressions

on:
  push:
    branches: [arrepath/3.1.4]
  pull_request:

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . 'rdkit==2025.9.4'
      - run: python -m unittest discover -s tests -p test_smallest_transformation.py
      - run: python -m unittest discover -s tests -p test_index.py
