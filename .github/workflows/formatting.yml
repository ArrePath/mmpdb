name: Python formatting

on:
  pull_request:
  push:
    branches: [arrepath/3.1.4]

permissions:
  contents: read

jobs:
  ruff-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: false
      - name: Check Python formatting
        run: uvx --from pre-commit==4.6.2 pre-commit run ruff-format --all-files --show-diff-on-failure
